<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="220" fill="#818cf8" opacity="0.07" filter="url(#glow)"/>

  <!-- Application Window Frame -->
  <g transform="translate(40, 30)">
    <!-- Main Window Background -->
    <rect width="1120" height="615" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.95"/>

    <!-- Window Top Header Bar -->
    <rect width="1120" height="54" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Window Controls -->
    <circle cx="30" cy="27" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="27" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="66" cy="27" r="6" fill="#10b981" opacity="0.8"/>

    <!-- Brand / Title -->
    <g transform="translate(100, 18)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="url(#primaryGrad)"/>
      <path d="M6 11 L16 11 M11 6 L11 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="16" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="0.5">AI STARTUP COPILOT</text>
      <rect x="200" y="2" width="70" height="18" rx="9" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
      <text x="210" y="15" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">AGENTIC AI</text>
    </g>

    <!-- Header Status Pills -->
    <g transform="translate(860, 18)">
      <rect x="0" y="0" width="130" height="22" rx="11" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#10b981"/>
      <text x="24" y="15" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">6 Agents Active</text>
      <circle cx="155" cy="11" r="12" fill="#334155"/>
      <text x="151" y="15" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">SP</text>
    </g>

    <!-- LEFT SIDEBAR -->
    <g transform="translate(20, 74)">
      <rect width="180" height="520" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
      
      <!-- Nav Items -->
      <g transform="translate(14, 20)">
        <!-- Active Item -->
        <rect x="0" y="0" width="152" height="34" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="12">✦ Co-Founder Hub</text>
        
        <text x="14" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="12">📊 Market Intel</text>
        <text x="14" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="12">🎯 Competitor Map</text>
        <text x="14" y="146" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="12">💡 Product Roadmap</text>
        <text x="14" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="12">📈 Financial Models</text>
        <text x="14" y="226" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="12">💼 Pitch Deck AI</text>
      </g>
    </g>

    <!-- MAIN CONTENT AREA -->
    <!-- Top Metric Cards -->
    <g transform="translate(216, 74)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="18" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-transform="uppercase">Validation Score</text>
        <text x="18" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="28">94.8%</text>
        <text x="130" y="65" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="12">▲ High</text>
        <rect x="18" y="78" width="174" height="4" rx="2" fill="#334155"/>
        <rect x="18" y="78" width="165" height="4" rx="2" fill="url(#primaryGrad)"/>
      </g>

      <!-- Card 2 -->
      <g transform="translate(226, 0)">
        <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="18" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-transform="uppercase">Total Addressable Mkt</text>
        <text x="18" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="28">$14.2B</text>
        <text x="145" y="65" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="12">CAGR 28%</text>
        <rect x="18" y="78" width="174" height="4" rx="2" fill="#334155"/>
        <rect x="18" y="78" width="140" height="4" rx="2" fill="url(#accentGrad)"/>
      </g>

      <!-- Card 3 -->
      <g transform="translate(452, 0)">
        <rect width="210" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="18" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-transform="uppercase">Investor Readiness</text>
        <text x="18" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="28">Stage A</text>
        <text x="140" y="65" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="12">9/10 Match</text>
        <rect x="18" y="78" width="174" height="4" rx="2" fill="#334155"/>
        <rect x="18" y="78" width="155" height="4" rx="2" fill="#10b981"/>
      </g>

      <!-- Card 4 / LangGraph Node Status -->
      <g transform="translate(678, 0)">
        <rect width="206" height="96" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="16" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">🤖 MULTI-AGENT STATE</text>
        <text x="16" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="13">LangGraph Loop</text>
        <rect x="16" y="64" width="75" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="24" y="78" fill="#a5b4fc" font-family="system-ui, sans-serif" font-weight="600" font-size="10">FastAPI</text>
        <rect x="96" y="64" width="75" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="104" y="78" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">PostgreSQL</text>
      </g>
    </g>

    <!-- Center Agentic Graph Panel -->
    <g transform="translate(216, 186)">
      <rect width="560" height="408" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      
      <!-- Graph Header -->
      <g transform="translate(20, 24)">
        <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Autonomous Agent Architecture &amp; Growth Trajectory</text>
        <text x="0" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="11">Real-time reasoning graph connecting 6 specialized co-founder agents</text>
      </g>

      <!-- Chart Simulation Area -->
      <g transform="translate(24, 80)">
        <!-- Grid lines -->
        <line x1="0" y1="0" x2="512" y2="0" stroke="#334155" stroke-dasharray="4" opacity="0.4"/>
        <line x1="0" y1="50" x2="512" y2="50" stroke="#334155" stroke-dasharray="4" opacity="0.4"/>
        <line x1="0" y1="100" x2="512" y2="100" stroke="#334155" stroke-dasharray="4" opacity="0.4"/>
        <line x1="0" y1="150" x2="512" y2="150" stroke="#334155" stroke-dasharray="4" opacity="0.4"/>
        <line x1="0" y1="200" x2="512" y2="200" stroke="#334155" stroke-width="1" opacity="0.8"/>

        <!-- Chart Area Fill -->
        <path d="M0 160 Q 100 140, 180 100 T 320 60 T 420 30 T 512 10 L 512 200 L 0 200 Z" fill="url(#chartGrad)"/>
        <!-- Chart Curve Line -->
        <path d="M0 160 Q 100 140, 180 100 T 320 60 T 420 30 T 512 10" fill="none" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#subtleGlow)"/>

        <!-- Key Data Nodes -->
        <circle cx="180" cy="100" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
        <circle cx="320" cy="60" r="5" fill="#818cf8" stroke="#0f172a" stroke-width="2"/>
        <circle cx="420" cy="30" r="5" fill="#c084fc" stroke="#0f172a" stroke-width="2"/>
        <circle cx="512" cy="10" r="6" fill="#34d399" stroke="#0f172a" stroke-width="2"/>
      </g>

      <!-- Multi-Agent Nodes Flow in Bottom -->
      <g transform="translate(24, 310)">
        <!-- Node 1 -->
        <rect x="0" y="0" width="118" height="68" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="12" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Market Intel</text>
        <text x="12" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="10">Web Search</text>
        <text x="12" y="56" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">● Validated</text>

        <!-- Node 2 -->
        <rect x="130" y="0" width="118" height="68" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
        <text x="142" y="22" fill="#818cf8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Strategy Agent</text>
        <text x="142" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="10">LangGraph Plan</text>
        <text x="142" y="56" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">● Executing</text>

        <!-- Node 3 -->
        <rect x="260" y="0" width="118" height="68" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
        <text x="272" y="22" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Finance Model</text>
        <text x="272" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="10">Cashflow Forecast</text>
        <text x="272" y="56" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">● Optimized</text>

        <!-- Node 4 -->
        <rect x="390" y="0" width="122" height="68" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="402" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="11">Pitch Deck AI</text>
        <text x="402" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="10">Investor Ready</text>
        <text x="402" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">● Ready</text>
      </g>
    </g>

    <!-- RIGHT AI COPILOT CHAT PANEL -->
    <g transform="translate(790, 186)">
      <rect width="294" height="408" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>

      <!-- Panel Header -->
      <g transform="translate(18, 20)">
        <circle cx="10" cy="10" r="10" fill="url(#primaryGrad)"/>
        <text x="28" y="14" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Co-Founder Assistant</text>
        <text x="28" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="500" font-size="10">GPT-4o &amp; Gemini Multi-Agent</text>
      </g>

      <!-- Chat Bubbles -->
      <g transform="translate(16, 68)">
        <!-- AI Message 1 -->
        <rect width="262" height="68" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="12" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="11">✦ Market Agent</text>
        <text x="12" y="40" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Target customer segment verified with</text>
        <text x="12" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">88% initial willingness-to-pay.</text>

        <!-- User Message -->
        <g transform="translate(42, 80)">
          <rect width="220" height="44" rx="10" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
          <text x="12" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10">Generate competitive barrier analysis</text>
          <text x="12" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10">and 12-month runway projection.</text>
        </g>

        <!-- AI Message 2 -->
        <g transform="translate(0, 136)">
          <rect width="262" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
          <text x="12" y="22" fill="#818cf8" font-family="system-ui, sans-serif" font-weight="600" font-size="11">✦ Strategy &amp; Finance Agents</text>
          <text x="12" y="40" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Runway model generated:</text>
          <text x="12" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">✓ $250k initial ARR break-even month 8</text>
          <text x="12" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="10">✓ Moat: Custom LangGraph domain state</text>
        </g>
      </g>

      <!-- Input Bar Area -->
      <g transform="translate(16, 345)">
        <rect width="262" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Ask co-founder agents anything...</text>
        <circle cx="238" cy="21" r="13" fill="url(#primaryGrad)"/>
        <path d="M233 21 L242 21 M238 17 L242 21 L238 25" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
